<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Lección 175 de Un Curso de Milagros. Acceso al texto oficial.">
  <title>Lección 175 · UCDM</title>
  <style>
    :root{--bg:#f5f1eb;--paper:#fff;--ink:#302c27;--muted:#777069;--accent:#a66c4f;--accent2:#6f7a67;--line:#e7dfd5;--soft:#f9f6f2;--orange:#d8792f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.65}
    .wrap{max-width:820px;margin:auto;padding:26px 16px 56px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 38px rgba(54,40,28,.07);overflow:hidden}
    .hero{padding:42px 38px 32px;background:linear-gradient(180deg,#fff 0%,#fbf8f4 100%);border-bottom:1px solid var(--line)}
    .kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-bottom:12px}
    .kicker a{color:inherit;text-decoration:none}
    h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(2.05rem,7vw,3.65rem);line-height:1.08;margin:0 0 14px}
    .lead{font-family:Georgia,"Times New Roman",serif;color:var(--accent);font-size:1.22rem;margin:0}
    .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}
    a.btn{display:flex;justify-content:center;align-items:center;gap:8px;min-height:76px;text-align:center;text-decoration:none;border-radius:14px;padding:16px 12px;font-weight:700;border:2px solid var(--accent);font-size:1rem;line-height:1.35}
    a.btn:focus-visible{outline:3px solid var(--accent2);outline-offset:4px}
    a.btn:hover{box-shadow:0 6px 16px rgba(54,40,28,.12)}
    a.secondary{color:var(--accent);background:#fff}
    .btn.disabled{display:flex;justify-content:center;align-items:center;border:2px solid var(--line);background:#f4f1ec;color:#888078;min-height:76px;border-radius:14px;padding:16px 12px;font-size:1rem;font-weight:650;text-align:center;line-height:1.35;cursor:not-allowed}
    a.comment{background:#855438;color:#fff;border-color:#855438;box-shadow:0 5px 14px rgba(133,84,56,.18)}
    .content{padding:36px 38px 42px}
    section+section{margin-top:38px;padding-top:34px;border-top:1px solid var(--line)}
    h2{font-family:Georgia,"Times New Roman",serif;font-size:1.55rem;font-weight:500;margin:0 0 16px}
    p{margin:0 0 18px}
    table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
    th,td{padding:13px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
    th{background:#faf8f5;font-size:.9rem}
    tr:last-child td{border-bottom:0}
    td:first-child{font-weight:650;width:24%}
    .review-item{padding:16px 0;border-bottom:1px solid var(--line)}.review-item p{margin:0 0 10px}.review-links a{display:inline-block;padding:9px 13px;border:1px solid var(--accent);border-radius:9px;color:var(--accent);text-decoration:none;font-weight:600;font-size:.92rem}.review-links a:hover{background:var(--soft)}
    .question{background:var(--soft);border-radius:16px;padding:22px;font-family:Georgia,"Times New Roman",serif;font-size:1.17rem}
    .share-note{margin:18px 0 14px;color:var(--muted);font-size:.98rem}
    .share-cta{display:flex;width:100%;justify-content:center;align-items:center;text-align:center;text-decoration:none;background:var(--orange);color:#fff;border-radius:12px;padding:15px 20px;font-weight:700;font-size:1rem;margin-top:14px}
    .source{font-size:.84rem;color:var(--muted);margin-top:28px}
    .source a{color:inherit}
    .footer{text-align:center;color:var(--muted);font-size:.82rem;padding:0 20px 26px}
    @media(max-width:600px){
      .wrap{padding:0}
      .card{border-radius:0;border-left:0;border-right:0}
      .hero,.content{padding-left:22px;padding-right:22px}
      .hero{padding-top:32px}
      .actions{grid-template-columns:1fr}
      .btn{justify-content:center;min-height:62px}
      table{font-size:.92rem}
      th,td{padding:11px 9px}
      td:first-child{width:29%}
    }
  </style>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Espacio Esencial · Un Curso de Milagros">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Lección 175 · UCDM">
  <meta property="og:description" content="Acceso al texto oficial · Espacio Esencial.">

  <meta property="og:url" content="https://espacio-esencial.github.io/leccion-175.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://espacio-esencial.github.io/assets/espacio-esencial-social.jpg">

  <!-- Lección 175 · acceso al texto oficial -->
<meta name="referrer" content="no-referrer">
</head>
<body>
  <div class="wrap">
    <article class="card">
      <header class="hero">
        <div class="kicker"><a href="index.html">← Inicio</a> · Grupo de estudio · Un Curso de Milagros</div>
        <h1>Lección 175</h1>
        <p class="lead">Dios es sólo Amor y, por ende, eso es lo que soy yo.</p>

        <div class="actions" style="grid-template-columns:1fr;max-width:360px">
          <a class="btn secondary" href="https://lecciones.acim.org/es/chapters/lesson-175" target="_blank" rel="noopener">📖 Leer el texto</a>
        </div>
      </header>

      <div class="footer">Lección diaria · Grupo de estudio UCDM</div>
    </article>
  </div>
</body>
</html>
